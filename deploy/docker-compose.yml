
name: agent

services:
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-..}/volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in deploy/.env or shell}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in deploy/.env or shell}
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-..}/volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.6.24
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in deploy/.env or shell}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in deploy/.env or shell}
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-..}/volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    depends_on:
      - etcd
      - minio
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  app:
    container_name: tlq-app
    build:
      context: ..
      dockerfile: rag_service/Dockerfile
    image: traffic-law-qa:0.1.0
    env_file:
      - path: ../.env
        required: false
    # 嵌入/重排跑 GPU；宿主机没有 NVIDIA 卡或没开 WSL2 直通时删掉这行，模型会退回 CPU
    gpus: all
    environment:
      MILVUS_URI: http://standalone:19530
    volumes:
      - tlr_chunks:/app/法规知识库/chunks
      - tlr_index:/app/法规知识库/index
      - tlr_docx:/app/法规知识库/docx
      - tlr_data:/app/data
      - ../法规知识库/models:/app/法规知识库/models:ro
    depends_on:
      standalone:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)\""]
      interval: 30s
      start_period: 180s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  agent:
    container_name: tlq-agent
    build:
      context: ..
      dockerfile: agent_service/Dockerfile
    image: traffic-law-qa-agent:0.1.0
    env_file:
      - path: ../.env
        required: false
    environment:
      RAG_BASE_URL: http://app:8000
      AGENT_CLARIFY: "1"
    ports:
      - "8001:8000"
    volumes:
      - tlr_sessions:/app/data
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request;d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=5));raise SystemExit(0 if d['status']=='ok' and d['rag']['status']=='ok' else 1)"]
      interval: 30s
      start_period: 60s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  web:
    container_name: tlq-web
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    image: traffic-law-qa-web:0.1.0
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  tlr_chunks:
  tlr_index:
  tlr_docx:
  tlr_data:
  tlr_sessions:

networks:
  default:
    name: milvus
