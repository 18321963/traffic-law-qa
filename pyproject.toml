[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-law-qa"
version = "0.1.0"
description = "交通法规问答 Agent：分层 RAG 管道 + Agentic RAG（Milvus 混合检索 / 强制引用式生成）"
requires-python = ">=3.10"
authors = [{ name = "18321963" }]
keywords = ["rag", "agent", "langgraph", "milvus", "legal", "traffic-law"]

dependencies = [
    "python-dotenv>=1.0",
    "openai>=1.40",
    "pymilvus>=2.6,<3",
    "httpx>=0.27",
]

[project.optional-dependencies]
agent = [
    "langgraph>=1.2.11,<1.3",
    "langchain-core>=1.4.7,<2",
    "langchain-openai>=1.5.1,<2",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]
langfuse = [
    "langfuse>=4.15,<5",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
all = [
    "traffic-law-qa[agent,api,dev]",
]

[project.scripts]
tlq-qa = "traffic_law_qa.__main__:main"
tlq-serve = "traffic_law_qa.main:main"

[project.urls]
Homepage = "https://github.com/18321963/traffic-law-qa"

[tool.setuptools.packages.find]
include = ["traffic_law_qa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: 需要 Milvus / 模型端点，默认跳过（pytest -m integration 显式开启）",
]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [".venv", "volumes", "法规知识库"]

[tool.ruff.lint]
select = ["E", "F", "I"]
