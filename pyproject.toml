[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-law-rag"
version = "0.1.0"
description = "交通法规问答 Agent：分层 RAG 管道 + Agentic RAG（Milvus 混合检索 / 强制引用式生成）"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "陈淼森" }]
keywords = ["rag", "agent", "langgraph", "milvus", "legal", "traffic-law"]

# 基础安装刻意保持精简，延续项目「能不加依赖就不加」的取舍：
# 解析 docx 走标准库，分页/BM25 走 Milvus 服务端，都不需要额外包。
# Agent 与 API 是可选能力，按需装 extra。
dependencies = [
    "python-dotenv>=1.0",
    "openai>=1.40",
    "pymilvus>=2.6,<3",
]

[project.optional-dependencies]
# Agentic RAG：LangGraph 编排 + LangChain 的 OpenAI 兼容模型封装
#
# langchain-openai 的下限卡在 1.5.1 而不是 1.0：1.5.0 之前的版本把 openai SDK
# 锁在 <3.0.0，装上会把基础依赖里的 openai 从 3.x 降级，而 generator.py 直接
# 用 `from openai import OpenAI`，不能跟着降。
# langgraph-prebuilt 与 langgraph 核心版本要一起动（它不声明对核心的依赖），
# 所以这里都按 1.2 线钉住。
agent = [
    "langgraph>=1.2.11,<1.3",
    "langchain-core>=1.4.7,<2",
    "langchain-openai>=1.5.1,<2",
]
# HTTP 服务层：FastAPI + SSE 流式
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
all = [
    "traffic-law-rag[agent,api,dev]",
]

[project.scripts]
tlr-qa = "traffic_law_rag.__main__:main"
tlr-serve = "traffic_law_rag.server_demo:main"

[project.urls]
Homepage = "https://github.com/18321963/traffic-law-rag"

[tool.setuptools.packages.find]
include = ["traffic_law_rag*"]

# ------------------------------------------------------------------ pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
# 测试必须离线可跑：不连 Milvus、不发网络请求。
# 需要真实端点的用例用 @pytest.mark.integration 标记并在默认运行时跳过。
addopts = "-q --strict-markers"
markers = [
    "integration: 需要 Milvus / 模型端点，默认跳过（pytest -m integration 显式开启）",
]

# ------------------------------------------------------------------ ruff
[tool.ruff]
# 120 而不是 100：E501 按**显示宽度**算，全角字符占两列，而这个仓库的注释全是中文。
# 100 列只放得下约 48 个汉字，会逼着把中文注释折成碎片；120 列约 58 个汉字，
# 是中文注释比较舒服的宽度，也刚好等于现有已验证代码的实际行宽上限。
line-length = 120
target-version = "py310"
exclude = [".venv", "volumes", "法规知识库"]

[tool.ruff.lint]
# 先只开三组：真错误（F）、行宽与空白（E）、导入顺序（I）。
# 不引入需要大量改动已验证检索/切分逻辑的规则组。
select = ["E", "F", "I"]
